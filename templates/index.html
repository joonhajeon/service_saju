{% extends "base.html" %}
{% block title %}사주 분석{% endblock %}
{% block content %}
<div class="input-container">
  <div class="tabs" id="personTabs">
    <button class="tab active" data-idx="0" onclick="switchTab(0)">1번</button>
  </div>
  <button class="btn-add-tab" onclick="addTab()">+ 추가</button>

  <div id="tabContents">
    <div class="tab-content active" data-idx="0">
      <div class="input-mode-toggle">
        <button class="mode-btn active" onclick="setMode(0, 'direct')">직접 입력</button>
        <button class="mode-btn" onclick="setMode(0, 'celebrity')">유명인 검색</button>
      </div>

      <div class="celebrity-search hidden" data-idx="0">
        <div style="display:flex;gap:6px;margin-bottom:4px">
          <input type="text" class="celebrity-input" placeholder="예: 손흥민 / 축구선수 박지성 / 쿨의 김성수" style="flex:1" onkeydown="if(event.key==='Enter') searchCelebrity(0)">
          <button class="btn-search" onclick="searchCelebrity(0)">검색</button>
        </div>
        <div style="color:#999;font-size:11px;margin-bottom:6px">이름만 입력하거나 "직업+이름"으로 입력하면 더 정확합니다</div>
        <div class="celebrity-results"></div>
      </div>

      <div class="direct-input" data-idx="0">
        <div class="form-row">
          <label>이름</label>
          <input type="text" class="input-name" placeholder="이름 (선택)">
        </div>
        <div class="form-row">
          <label>생년월일</label>
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:4px;margin-bottom:5px">
              <button type="button" class="cal-btn active" onclick="setCalType(0,'solar')">양력</button>
              <button type="button" class="cal-btn" onclick="setCalType(0,'lunar')">음력</button>
              <label class="lunar-leap-row" style="display:none;margin-left:6px">
                <input type="checkbox" class="input-lunar-leap"> 윤달(閏月)
              </label>
            </div>
            <input type="text" class="input-date" placeholder="YYYY.MM.DD">
          </div>
        </div>
        <div class="form-row">
          <label>시간</label>
          <input type="text" class="input-time" placeholder="HH:MM (모르면 빈칸)">
        </div>
        <div class="form-row">
          <label>성별</label>
          <select class="input-gender">
            <option value="여">여</option>
            <option value="남">남</option>
          </select>
        </div>
        <div class="form-row">
          <label>커리어 타입</label>
          <select class="input-career">
            <option value="직장인">직장인</option>
            <option value="사업가">사업가</option>
            <option value="프리랜서">프리랜서</option>
            <option value="연예인">연예인</option>
            <option value="운동선수">운동선수</option>
            <option value="정치인">정치인</option>
            <option value="공인·전문직">공인·전문직</option>
            <option value="학생">학생</option>
            <option value="주부">주부</option>
            <option value="타입없음">타입 없음</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-save-only" onclick="saveOnly()">💾 저장하기</button>
    <button class="btn-analyze" onclick="startAnalysis()">📊 사주팔자 보기</button>
  </div>
</div>
{% endblock %}
