{% extends "base.html" %}
{% block title %}궁합 내역{% endblock %}
{% block content %}
<div style="max-width:1200px;margin:0 auto">

  <!-- ── 헤더 (JS 렌더) ── -->
  <div id="ghHeader"></div>

  <!-- ── 목록 패널 ── -->
  <div id="historyPanel">
    <div id="historyList"
      style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:24px">
      <div style="color:#aaa;font-size:14px">불러오는 중...</div>
    </div>
  </div>

  <!-- ── 상세 뷰 ── -->
  <div id="detailView" style="display:none">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--bg3)">
      <button onclick="closeDetail()" class="btn-back">← 목록</button>
      <span id="detailTitle" style="font-size:17px;font-weight:bold;color:var(--accent)"></span>
      <button onclick="deleteRecord()" style="margin-left:auto;background:var(--red);color:white;border:none;padding:6px 14px;border-radius:5px;cursor:pointer;font-size:13px">🗑️ 삭제</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
      <div id="detailCard1" style="border:2px solid var(--blue);border-radius:8px;padding:14px;background:white"></div>
      <div id="detailCard2" style="border:2px solid var(--red);border-radius:8px;padding:14px;background:white"></div>
    </div>
    <div style="background:white;border:1px solid var(--bg3);border-radius:6px;padding:20px;line-height:1.8">
      <div style="font-weight:bold;color:var(--accent);font-size:15px;margin-bottom:12px">📋 궁합 분석 결과</div>
      <div id="detailResult"></div>
    </div>
  </div>
</div>

<!-- ── 폴더 생성 모달 ── -->
<div id="folderCreateModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center">
  <div style="background:white;border-radius:10px;padding:28px 24px;min-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.2)">
    <div style="font-weight:bold;font-size:16px;margin-bottom:16px;color:var(--accent)">📁 새 폴더 만들기</div>
    <input id="newFolderName" type="text" placeholder="폴더 이름"
      style="width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px;margin-bottom:14px"
      onkeydown="if(event.key==='Enter')confirmCreateFolder()">
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="confirmCreateFolder()" style="background:var(--accent);color:white;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px">만들기</button>
      <button onclick="closeFolderModal()" style="background:#eee;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px">취소</button>
    </div>
  </div>
</div>

<style>
.gh-card { background:white; border:2px solid var(--bg3); border-radius:8px; padding:14px; cursor:pointer; transition:box-shadow .15s; position:relative; user-select:none; }
.gh-card:hover { box-shadow:0 2px 10px rgba(0,0,0,.12); }
.gh-card.gh-selected { border-color:var(--accent); background:#f8f4ff; }
.gh-folder-card { background:white; border:1px solid #ddd; border-radius:8px; padding:14px 14px 12px; cursor:pointer; transition:box-shadow .15s; position:relative; display:flex; flex-direction:column; gap:4px; }
.gh-folder-card:hover { box-shadow:0 2px 10px rgba(0,0,0,.12); background:#fafafa; }
.gh-folder-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-bottom:12px; }
.gh-divider { border:none; border-top:1px solid #e0e0e0; margin:8px 0 14px; color:#aaa; font-size:12px; text-align:center; position:relative; }
.gh-divider span { background:var(--bg2,#f8f8f8); padding:0 10px; position:relative; top:-9px; }
.gh-folder-btn { background:none; border:none; cursor:pointer; font-size:15px; padding:2px 5px; border-radius:4px; line-height:1; }
.gh-folder-btn:hover { background:#eee; }
.move-dropdown { position:fixed; background:white; border:1px solid #ddd; border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,.15); min-width:180px; z-index:9999; overflow:hidden; }
.move-dropdown button { display:block; width:100%; text-align:left; padding:9px 14px; background:none; border:none; cursor:pointer; font-size:13px; }
.move-dropdown button:hover { background:#f5f5f5; }
.gh-breadcrumb { display:flex; align-items:center; gap:4px; font-size:14px; flex-wrap:wrap; }
.gh-breadcrumb-item { cursor:pointer; color:#888; padding:2px 4px; border-radius:4px; }
.gh-breadcrumb-item:hover { background:#eee; color:var(--accent); }
.gh-breadcrumb-item.active { color:var(--accent); font-weight:bold; cursor:default; }
.gh-breadcrumb-item.active:hover { background:none; }
</style>

<script>
// ── 상태 ──────────────────────────────────────────────────────
let ghSelectedIds = new Set();
let ghCurrentFolder = null; // null = 루트, string = 폴더id
let ghFolderStack = [];     // [{id, name}]
let ghAllFolders  = [];
let ghViewAll     = false;
let ghCurrentRecordId = null;

// ── 초기화 ────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => { loadGH(); });

async function loadGH() {
  await refreshGHFolders();
  if (ghViewAll) { await loadAllRecords(); return; }
  renderGHHeader();
  await loadGHHistory();
}

async function refreshGHFolders() {
  try {
    const res = await fetch('/api/goonghap-folders');
    ghAllFolders = await res.json();
  } catch(e) { ghAllFolders = []; }
}

// ── 헤더 렌더링 ───────────────────────────────────────────────
function renderGHHeader() {
  const hdr = document.getElementById('ghHeader');
  if (!hdr) return;
  const n = ghSelectedIds.size;

  // 브레드크럼
  let bc = `<span class="gh-breadcrumb-item${ghCurrentFolder===null?' active':''}" onclick="ghNavTo(-1)">💑 궁합 내역</span>`;
  ghFolderStack.forEach((item, i) => {
    bc += `<span style="color:#ccc;margin:0 2px">›</span>`;
    const isLast = (i === ghFolderStack.length - 1);
    bc += `<span class="gh-breadcrumb-item${isLast?' active':''}" onclick="ghNavTo(${i})">📁 ${item.name}</span>`;
  });

  const viewAllBtn = `<button onclick="ghToggleViewAll()" style="background:${ghViewAll?'#e8e8e8':'white'};border:1px solid #ccc;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px">${ghViewAll?'📁 폴더보기':'🔍 전체보기'}</button>`;
  const btnBase = 'border:none;padding:6px 13px;border-radius:6px;cursor:pointer;font-size:13px;color:white;';

  let actionBtns = `
    ${viewAllBtn}
    <button onclick="openGHFolderModal()" style="${btnBase}background:var(--accent)">📁 새 폴더</button>
    <div style="position:relative;display:inline-block">
      <button id="ghBtnMove" onclick="showGHMoveDropdown()" ${n===0?'disabled':''} style="${btnBase}background:#5c6bc0;opacity:${n===0?.5:1}">📂 폴더 이동 (${n}) ▾</button>
    </div>`;

  if (ghCurrentFolder !== null) {
    actionBtns += `<button id="ghBtnMoveOut" onclick="ghMoveOut()" ${n===0?'disabled':''} style="${btnBase}background:#78909c;opacity:${n===0?.5:1}">📤 미배정으로 꺼내기 (${n})</button>`;
  }

  actionBtns += `<button id="ghBtnDelete" onclick="ghDeleteSelected()" ${n===0?'disabled':''} style="${btnBase}background:var(--red);opacity:${n===0?.5:1}">🗑️ 삭제 (${n})</button>`;

  let backBtn = '';
  if (ghCurrentFolder !== null) {
    backBtn = `<button class="btn-back" onclick="ghGoBack()" style="margin-right:4px">← 상위로</button>`;
  }

  hdr.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      ${backBtn}
      <div class="gh-breadcrumb">${bc}</div>
      <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        ${actionBtns}
      </div>
    </div>
  `;
}

// ── 폴더 탐색 ─────────────────────────────────────────────────
function enterGHFolder(folderId) {
  const f = ghAllFolders.find(x => x.id === folderId);
  ghFolderStack.push({ id: folderId, name: f ? f.name : folderId });
  ghCurrentFolder = folderId;
  loadGH();
}

function ghGoBack() {
  ghFolderStack.pop();
  ghCurrentFolder = ghFolderStack.length > 0 ? ghFolderStack[ghFolderStack.length-1].id : null;
  loadGH();
}

function ghNavTo(index) {
  if (index < 0) {
    ghFolderStack = [];
    ghCurrentFolder = null;
  } else {
    ghFolderStack = ghFolderStack.slice(0, index + 1);
    ghCurrentFolder = ghFolderStack[index].id;
  }
  loadGH();
}

function ghToggleViewAll() {
  ghViewAll = !ghViewAll;
  ghFolderStack = [];
  ghCurrentFolder = null;
  loadGH();
}

// ── 목록 로드 ─────────────────────────────────────────────────
async function loadGHHistory() {
  const container = document.getElementById('historyList');
  container.innerHTML = '<div style="color:#aaa;font-size:14px;grid-column:1/-1">불러오는 중...</div>';

  // 폴더 카드 (루트 레벨의 폴더들)
  const folderGrid = await renderGHFolderGrid();

  // 궁합 카드
  let url = '/api/goonghap-history';
  if (ghCurrentFolder !== null) {
    url += `?folder=${encodeURIComponent(ghCurrentFolder)}`;
  } else {
    url += '?folder=root';
  }

  try {
    const res = await fetch(url);
    const records = await res.json();

    let html = folderGrid;

    if (records.length === 0 && !folderGrid) {
      const msg = ghCurrentFolder ? '이 폴더에 궁합 내역이 없습니다.' : '저장된 궁합 내역이 없습니다.';
      html = `<div style="color:#888;font-size:14px;grid-column:1/-1">${msg}</div>`;
    } else if (records.length === 0) {
      html += '<div style="color:#999;font-size:13px;grid-column:1/-1">궁합 내역이 없습니다.</div>';
    } else {
      if (folderGrid) {
        html += `<div class="gh-divider" style="grid-column:1/-1"><span>${ghCurrentFolder?'궁합 내역':'폴더 미배정 궁합'}</span></div>`;
      }
      html += records.map(r => renderGHCard(r)).join('');
    }

    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = '<div style="color:#c62828;grid-column:1/-1">내역을 불러오는 중 오류가 발생했습니다.</div>';
  }
}

async function loadAllRecords() {
  renderGHHeader();
  const container = document.getElementById('historyList');
  container.innerHTML = '<div style="color:#aaa;font-size:14px;grid-column:1/-1">불러오는 중...</div>';
  try {
    const res = await fetch('/api/goonghap-history');
    const records = await res.json();
    if (records.length === 0) {
      container.innerHTML = '<div style="color:#888;font-size:14px;grid-column:1/-1">저장된 궁합 내역이 없습니다.</div>';
      return;
    }
    container.innerHTML = records.map(r => {
      const folderName = r.folder ? (ghAllFolders.find(f=>f.id===r.folder)||{name:r.folder}).name : null;
      const badge = folderName ? `<span style="font-size:10px;background:#f0f0f0;color:#666;border-radius:3px;padding:1px 6px;margin-left:5px">📁 ${folderName}</span>` : '';
      return renderGHCard(r, badge);
    }).join('');
  } catch(e) {
    container.innerHTML = '<div style="color:#c62828;grid-column:1/-1">오류가 발생했습니다.</div>';
  }
}

async function renderGHFolderGrid() {
  // 현재 레벨 폴더 목록 반환 (html string)
  const folders = ghAllFolders;
  if (folders.length === 0) return '';
  const html = `
    <div class="gh-folder-grid" style="grid-column:1/-1">
      ${folders.map(f => {
        const esc = s => s.replace(/'/g,"\\'");
        return `<div class="gh-folder-card" onclick="enterGHFolder('${esc(f.id)}')">
          <div style="font-size:22px">📁</div>
          <div style="font-weight:bold;font-size:14px;margin-top:2px">${f.name}</div>
          <div style="font-size:12px;color:#aaa">${f.count||0}건</div>
          <div style="display:flex;gap:4px;margin-top:6px">
            <button class="gh-folder-btn" onclick="event.stopPropagation();renameGHFolder('${esc(f.id)}','${esc(f.name)}')" title="이름 변경">✏️</button>
            <button class="gh-folder-btn" onclick="event.stopPropagation();deleteGHFolder('${esc(f.id)}')" title="폴더 삭제" style="color:#e53935">✕</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  return html;
}

function renderGHCard(r, extraBadge='') {
  const dt = r.created_at ? r.created_at.slice(0,10) : '';
  const isSelected = ghSelectedIds.has(r.id);
  const esc = s => String(s).replace(/'/g,"\\'");
  return `<div class="gh-card${isSelected?' gh-selected':''}" data-id="${r.id}"
    onclick="ghToggleSelect('${esc(r.id)}', this)"
    ondblclick="loadGHDetail('${encodeURIComponent(r.id)}')">
    <div style="font-size:17px;font-weight:bold;color:var(--accent);margin-bottom:4px">
      <span style="color:var(--blue)">${r.name1}</span>
      <span style="margin:0 6px;color:#ccc">↔</span>
      <span style="color:var(--red)">${r.name2}</span>
      ${extraBadge}
    </div>
    <div style="font-size:12px;color:#888">${dt}</div>
    <button onclick="event.stopPropagation();loadGHDetail('${encodeURIComponent(r.id)}')"
      style="position:absolute;top:10px;right:10px;background:var(--accent);color:white;border:none;padding:3px 9px;border-radius:4px;cursor:pointer;font-size:11px">상세</button>
  </div>`;
}

// ── 선택 ─────────────────────────────────────────────────────
function ghToggleSelect(id, card) {
  if (ghSelectedIds.has(id)) {
    ghSelectedIds.delete(id);
    card.classList.remove('gh-selected');
    card.style.borderColor = 'var(--bg3)';
    card.style.background = 'white';
  } else {
    ghSelectedIds.add(id);
    card.classList.add('gh-selected');
    card.style.borderColor = 'var(--accent)';
    card.style.background = '#f8f4ff';
  }
  renderGHHeader();
}

// ── 폴더 만들기 ───────────────────────────────────────────────
function openGHFolderModal() {
  document.getElementById('newFolderName').value = '';
  document.getElementById('folderCreateModal').style.display = 'flex';
  setTimeout(() => document.getElementById('newFolderName').focus(), 50);
}
function closeFolderModal() {
  document.getElementById('folderCreateModal').style.display = 'none';
}
async function confirmCreateFolder() {
  const name = document.getElementById('newFolderName').value.trim();
  if (!name) return;
  try {
    const res = await fetch('/api/goonghap-folders', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name})
    });
    const data = await res.json();
    if (data.success) { closeFolderModal(); loadGH(); }
    else alert(data.error || '폴더 생성 실패');
  } catch(e) { alert('오류: ' + e.message); }
}

// ── 폴더 이름 변경 ────────────────────────────────────────────
async function renameGHFolder(folderId, currentName) {
  const newName = prompt('새 폴더 이름:', currentName);
  if (!newName || !newName.trim() || newName.trim() === currentName) return;
  try {
    const res = await fetch(`/api/goonghap-folders/${encodeURIComponent(folderId)}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name: newName.trim()})
    });
    const data = await res.json();
    if (data.success) loadGH();
    else alert(data.error || '이름 변경 실패');
  } catch(e) { alert('오류: ' + e.message); }
}

// ── 폴더 삭제 ─────────────────────────────────────────────────
async function deleteGHFolder(folderId) {
  const f = ghAllFolders.find(x => x.id === folderId);
  if (!confirm(`"${f ? f.name : folderId}" 폴더를 삭제하시겠습니까?\n폴더 안의 궁합 내역은 미배정 상태가 됩니다.`)) return;
  try {
    const res = await fetch(`/api/goonghap-folders/${encodeURIComponent(folderId)}`, {method:'DELETE'});
    const data = await res.json();
    if (data.success) {
      if (ghCurrentFolder === folderId) { ghFolderStack.pop(); ghCurrentFolder = null; }
      loadGH();
    } else alert('삭제 실패');
  } catch(e) { alert('오류: ' + e.message); }
}

// ── 폴더 이동 (드롭다운) ──────────────────────────────────────
function showGHMoveDropdown() {
  if (ghSelectedIds.size === 0) return;
  const existing = document.getElementById('ghMoveDropdown');
  if (existing) { existing.remove(); return; }

  const dropdown = document.createElement('div');
  dropdown.id = 'ghMoveDropdown';
  dropdown.className = 'move-dropdown';
  dropdown.style.position = 'fixed';

  const others = ghAllFolders.filter(f => f.id !== ghCurrentFolder);
  if (others.length === 0) {
    dropdown.innerHTML = '<div style="padding:8px 12px;color:#999;font-size:13px">이동할 폴더가 없습니다</div>';
  } else {
    others.forEach(f => {
      const btn = document.createElement('button');
      btn.textContent = `📁 ${f.name} (${f.count||0})`;
      btn.onclick = () => ghMoveToFolder(f.id);
      dropdown.appendChild(btn);
    });
  }

  document.body.appendChild(dropdown);
  const trigger = document.getElementById('ghBtnMove');
  const rect = trigger.getBoundingClientRect();
  dropdown.style.top = (rect.bottom + 4) + 'px';
  dropdown.style.left = rect.left + 'px';

  // 화면 아래 넘치면 위에
  requestAnimationFrame(() => {
    const dd = dropdown.getBoundingClientRect();
    if (dd.bottom > window.innerHeight)
      dropdown.style.top = (rect.top - dd.height - 4) + 'px';
  });

  setTimeout(() => {
    document.addEventListener('click', function handler(e) {
      if (!dropdown.contains(e.target) && e.target !== trigger) {
        dropdown.remove();
        document.removeEventListener('click', handler);
      }
    });
  }, 0);
}

async function ghMoveToFolder(folderId) {
  document.getElementById('ghMoveDropdown')?.remove();
  if (ghSelectedIds.size === 0) return;
  try {
    const res = await fetch('/api/goonghap-history/bulk-move', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ids:[...ghSelectedIds], folder:folderId})
    });
    if ((await res.json()).success) { ghSelectedIds.clear(); loadGH(); }
    else alert('이동 실패');
  } catch(e) { alert('오류: ' + e.message); }
}

// ── 폴더 해제 ─────────────────────────────────────────────────
async function ghMoveOut() {
  if (ghSelectedIds.size === 0) return;
  try {
    const res = await fetch('/api/goonghap-history/bulk-move', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ids:[...ghSelectedIds], folder:null})
    });
    if ((await res.json()).success) { ghSelectedIds.clear(); loadGH(); }
  } catch(e) { alert('오류: ' + e.message); }
}

// ── 삭제 ─────────────────────────────────────────────────────
async function ghDeleteSelected() {
  if (ghSelectedIds.size === 0) return;
  if (!confirm(`선택한 ${ghSelectedIds.size}건의 궁합 내역을 삭제하시겠습니까?`)) return;
  let fail = 0;
  for (const id of [...ghSelectedIds]) {
    try {
      const res = await fetch(`/api/goonghap-history/${encodeURIComponent(id)}`, {method:'DELETE'});
      if (!res.ok) fail++;
    } catch(e) { fail++; }
  }
  if (fail > 0) alert(`${fail}건 삭제 실패`);
  ghSelectedIds.clear();
  loadGH();
}

// ── 상세 보기 ────────────────────────────────────────────────
async function loadGHDetail(encodedId) {
  const id = decodeURIComponent(encodedId);
  ghCurrentRecordId = id;
  document.getElementById('historyPanel').style.display = 'none';
  document.getElementById('ghHeader').style.display = 'none';
  document.getElementById('detailView').style.display = '';
  document.getElementById('detailCard1').innerHTML = '<div style="color:#aaa;font-size:13px">불러오는 중...</div>';
  document.getElementById('detailCard2').innerHTML = '';
  document.getElementById('detailResult').innerHTML = '';
  try {
    const res = await fetch(`/api/goonghap-history/${encodeURIComponent(id)}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    document.getElementById('detailTitle').textContent = `${data.name1} ↔ ${data.name2}  (${(data.created_at||'').slice(0,10)})`;
    renderDetailCard(1, data.name1, data.person1);
    renderDetailCard(2, data.name2, data.person2);
    document.getElementById('detailResult').innerHTML = data.result || '<span style="color:#aaa">저장된 분석 결과가 없습니다.</span>';
  } catch(e) {
    document.getElementById('detailCard1').innerHTML = `<span style="color:#c62828">${e.message}</span>`;
  }
}

function closeDetail() {
  ghCurrentRecordId = null;
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('historyPanel').style.display = '';
  document.getElementById('ghHeader').style.display = '';
}

function renderDetailCard(num, name, personData) {
  const card = document.getElementById(`detailCard${num}`);
  if (!personData || !personData.saju) {
    card.innerHTML = `<div style="color:#aaa;font-size:13px">${name} - 사주 데이터 없음</div>`;
    return;
  }
  const saju = personData.saju;
  const birthDateRaw = personData.birth_date || '';
  const _bds = String(birthDateRaw).replace(/[-\.]/g,'');
  const birthYear = _bds.length >= 4 ? parseInt(_bds.slice(0,4),10) : 0;
  const daeunTableId = `histDaeun-${num}`;
  const seunContainerId = `histSeun-${num}`;
  card.innerHTML = `
    <div style="font-size:15px;font-weight:bold;color:${num===1?'var(--blue)':'var(--red)'};margin-bottom:8px">${name}</div>
    ${renderSajuTable(saju)}
    <div style="margin-top:10px">${renderOhengDist(saju.oheng, saju.pillars)}</div>
    <div style="margin-top:10px">${birthYear ? renderDaeunTable(saju, birthYear, daeunTableId, seunContainerId) : ''}</div>
    <div id="${seunContainerId}" style="margin-top:6px"></div>
  `;
  if (saju.daeun && birthYear) {
    const cy = new Date().getFullYear();
    const cur = saju.daeun.find(d => { const py = birthYear+d.age; return py<=cy && cy<py+10; });
    if (cur) setTimeout(() => renderSeunTable(cur.age, birthYear, saju.ilgan, seunContainerId), 0);
  }
}

async function deleteRecord() {
  if (!ghCurrentRecordId) return;
  if (!confirm('이 궁합 내역을 삭제하시겠습니까?')) return;
  try {
    const res = await fetch(`/api/goonghap-history/${encodeURIComponent(ghCurrentRecordId)}`, {method:'DELETE'});
    const data = await res.json();
    if (data.success) { closeDetail(); loadGH(); }
    else alert('삭제 실패');
  } catch(e) { alert('오류: ' + e.message); }
}
</script>
